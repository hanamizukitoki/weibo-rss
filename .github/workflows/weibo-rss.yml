name: 发布微博热搜 RSS

on:
  push:
    paths:
      - '.github/workflows/weibo-rss.yml'
  workflow_dispatch:
  schedule:
    - cron: '11,26,41,56 * * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: weibo-rss-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 下载榜单并生成 RSS
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen
          from xml.etree.ElementTree import Element, ElementTree, SubElement

          source = "https://solarhell.github.io/hot-search-crawler/latest.json"
          with urlopen(source, timeout=20) as response:
              snapshot = json.load(response)

          board = next(
              (board for board in snapshot["boards"] if board["platform"] == "weibo"),
              None,
          )
          if not board or not board.get("ok") or not board.get("items"):
              raise SystemExit("上游没有可用的微博榜单，保留上次发布的 RSS")

          rss = Element("rss", version="2.0")
          channel = SubElement(rss, "channel")
          SubElement(channel, "title").text = "微博热搜"
          SubElement(channel, "link").text = "https://s.weibo.com/top/summary?cate=realtimehot"
          SubElement(channel, "description").text = "微博热搜榜快照"

          for entry in board["items"]:
              item = SubElement(channel, "item")
              SubElement(item, "title").text = entry["title"]
              SubElement(item, "link").text = entry["url"]
              SubElement(item, "guid", isPermaLink="true").text = entry["url"]
              SubElement(item, "description").text = (
                  f"排名 {entry['rank']}，热度 {entry.get('hot', '暂无')}"
              )

          Path("_site").mkdir(exist_ok=True)
          ElementTree(rss).write("_site/weibo.xml", encoding="utf-8", xml_declaration=True)
          print(f"已生成 {len(board['items'])} 条微博热搜")
          PY

      - name: 上传 Pages 文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 等待 GitHub API 列出发布产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run = os.environ["GITHUB_RUN_ID"]
          request = Request(
              f"{api}/repos/{repo}/actions/runs/{run}/artifacts?name=github-pages",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
              },
          )
          for attempt in range(12):
              try:
                  with urlopen(request, timeout=10) as response:
                      artifacts = json.load(response)["artifacts"]
                  if any(a["name"] == "github-pages" and not a["expired"] for a in artifacts):
                      print("GitHub API 已列出 github-pages 产物")
                      break
              except HTTPError as error:
                  if error.code not in (429, 500, 502, 503, 504):
                      raise
                  print(f"GitHub API 暂时返回 HTTP {error.code}")
              except (URLError, TimeoutError) as error:
                  print(f"查询产物暂时失败：{error}")
              if attempt < 11:
                  time.sleep(5)
          else:
              raise SystemExit("GitHub API 一直未列出本次运行的 github-pages 产物")
          PY

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
